[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "itsmbench-audit"
version = "0.1.0"
description = "Static preflight audit tooling for ITSMBench evaluations."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["itsm", "benchmark", "audit", "evaluation", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
itsmbench-audit = "itsmbench_audit.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["itsmbench_audit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
